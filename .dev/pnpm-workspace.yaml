# ShiranekoWrt: our tokens, not upstream's.
#
# The @eamonxg/luci-theme-tokens npm package is the UPSTREAM release (2.0.0,
# no shiranekowrt preset, no setguard operator). This repo's branding branch
# must ship OUR tokens (shiranekowrt preset, setguard, v3.0.0), which only the
# ShiranekoWrt fork carries. Link the fork's tokens subpackage as the package
# source so pnpm never resolves the upstream npm package.
#
# The fork moved to a monorepo: the tokens package now lives at
# packages/tokens (build.mjs, dist/aurora, package.json). Its dist/ is
# gitignored and built on demand by scripts/sync-tokens.mjs (buildCheckout).
overrides:
  '@eamonxg/luci-theme-tokens': link:../../luci-theme-tokens/packages/tokens
