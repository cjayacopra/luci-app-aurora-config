# Drift guard for the vendored color-token artifacts: tokens.global.js,
# color-tokens.conf, and the preset templates are vendored from the
# ShiranekoWrt fork of luci-theme-tokens (shiranekowrt/branding branch) — the
# source of truth that carries the shiranekowrt preset, the setguard operator
# and v3.0.0. The upstream npm package (@eamonxg/luci-theme-tokens) does NOT
# contain those, so this workflow checks out the fork as a sibling and
# validates the committed artifacts against the fork's freshly-built output.
# This fails when the committed artifacts no longer match — run
# `cd .dev && node scripts/sync-tokens.mjs` locally and commit to fix.
name: Token sync check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths:
      - ".dev/**"
      - "root/usr/share/aurora/**"
  pull_request:
    paths:
      - ".dev/**"
      - "root/usr/share/aurora/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .dev
    steps:
      - uses: actions/checkout@v4

      # sync-tokens.mjs resolves the token source as
      # ../luci-theme-tokens/packages/tokens (the fork is a monorepo; the
      # tokens package lives at packages/tokens) and builds dist/ from it.
      # dist/ is gitignored in the fork, so its devDependencies (esbuild,
      # colorjs.io) must be installed for the build to run.
      - name: Check out the ShiranekoWrt luci-theme-tokens fork as sibling
        uses: actions/checkout@v4
        with:
          repository: cjayacopra/luci-theme-tokens
          ref: shiranekowrt/branding
          path: ../luci-theme-tokens

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .dev/pnpm-lock.yaml

      - name: Install fork build deps
        run: pnpm install --frozen-lockfile
        working-directory: ../luci-theme-tokens

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check vendored artifacts against the fork build
        run: node scripts/sync-tokens.mjs --check

      - name: Run tests
        run: pnpm test
